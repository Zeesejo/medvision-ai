project:
  name: medvision-ai
  experiment_id: E01_densenet121_asl
  seed: 42
  deterministic: true

data:
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  test_csv: data/splits/test.csv
  img_dir: data/nih-chestxray14
  image_size: 320
  batch_size: 32
  num_workers: 4

model:
  backbone: densenet121
  pretrained: true
  dropout: 0.3
  freeze_backbone: false

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  early_stopping_patience: 7
  scheduler: cosine
  loss: asl_optimized
  loss_config:
    gamma_neg: 4
    gamma_pos: 0
    clip: 0.05
    label_smoothing: 0.0

logging:
  output_root: results/runs
  use_wandb: false
  wandb_project: medvision-ai
  wandb_entity: null
